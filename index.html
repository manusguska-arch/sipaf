function paAgrupa(rows){const used=new Set(),asc=rows.slice().sort((x,y)=>new Date(x.quando)-new Date(y.quando));
rows.filter(i=>i.acao==="importacao"&&i.detalhe).forEach(i=>{const t0=+new Date(i.quando);
[["cadastro",+i.detalhe.quantidade||0],["remocao",+i.detalhe.removidas||0]].forEach(([ac,max])=>{let n=0;
asc.forEach(a=>{if(n>=max||used.has(a)||a.acao!==ac||!a.codigo||a.quem_email!==i.quem_email)return;const t=+new Date(a.quando);if(t>=t0-5000&&t<=t0+6e5){used.add(a);n++}})})});
return rows.filter(a=>!used.has(a))}

function newShelf(h,l){const ss=S.shelves.filter(x=>x.h===h),sl=ss.filter(x=>x.l===l),i=sl.length?Math.max(...sl.map(x=>x.t))+1:1;let e=1,p=1;if(ss.length){const m=ss.reduce((a,b)=>b.e>a.e||(b.e===a.e&&b.p>a.p)?b:a);if(m.p<5){e=m.e;p=m.p+1}else e=m.e+1}S.shelves.push({h,e,p,l,i,t:i+CAP-1})}
function toISO(v){if(v instanceof Date&&!isNaN(v))return new Date(v.getTime()-v.getTimezoneOffset()*6e4+432e5).toISOString().slice(0,10);if(typeof v==="number")return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);v=String(v||"").trim();let m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return`${m[3]}-${p2(m[2])}-${p2(m[1])}`;m=v.match(/^\d{4}-\d{2}-\d{2}/);return m?m[0]:null}
function parseInv(rows,h,mode){const out=[],bad=[],seen=new Set(S.recs.filter(r=>mode!=="sub"||r.h!==h).map(r=>r.c));let dups=0;const rx=new RegExp("^"+h+"-[A-Z]-\\d{4,}$");

async function readFile(f){if(typeof XLSX==="undefined"){IMP={err:"A biblioteca de leitura de planilhas não carregou. Verifique a conexão e recarregue a página."};return}try{const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true}),ws=wb.Sheets["Inventário"]||wb.Sheets[wb.SheetNames[0]];IMP={raw:XLSX.utils.sheet_to_json(ws,{defval:"",raw:true}),file:f.name}}catch(x){IMP={err:"Não foi possível ler o arquivo. Use .xlsx ou .csv."}}}
function reparse(){if(!IMP||!IMP.raw)return;IMP.h=$("#ih").value;IMP.mode=$("#im").value;Object.assign(IMP,parseInv(IMP.raw,IMP.h,IMP.mode));$("#imp").innerHTML=impPrev()}
function impPrev(){const I=IMP;if(!I)return'<p class="note">Nenhum arquivo carregado.</p>';if(I.err)return`<div class="er">${I.err}</div>`;if(!I.out)return"";return`<p style="margin-top:22px"><b>${fmt(I.out.length)}</b> pasta(s) prontas para importar em <b>${I.h}</b> · ${I.dups} já existente(s), ignorada(s) · ${I.bad.length} linha(s) com problema.</p>${I.mode==="sub"?`<div class="bn">As ${R.filter(r=>r.h===I.h).length} pastas atuais de ${I.h} serão removidas antes da importação.</div>`:""}${I.bad.length?`<p class="note">${I.bad.slice(0,6).map(esc).join("<br>")}${I.bad.length>6?"<br>…":""}</p>`:""}${I.out.length?`<div class="tw"><table><thead><tr><th>Código</th><th>Nome</th><th>Matrícula</th><th>Admissão</th><th>Demissão</th><th>Folhas</th></tr></thead><tbody>${I.out.slice(0,8).map(r=>`<tr><td><code>${r.c||"gerado ao importar"}</code></td><td>${esc(r.n)}</td><td>${esc(r.m)}</td><td>${fd(r.a)}</td><td>${fd(r.d)}</td><td>${r.f??"—"}</td></tr>`).join("")}</tbody></table></div><p class="note">Mostrando as 8 primeiras linhas.</p><button class="btn" data-act="doimp">Importar ${fmt(I.out.length)} pastas</button>`:""}`}
async function doImp(){const{h,out,mode}=IMP;if(SBC){try{await SBC.rpc("registrar_evento",{p_acao:"importacao",p_detalhe:{entidade:h,modo:mode==="sub"?"substituir":"acrescentar",quantidade:out.length,arquivo:IMP.file||null,removidas:mode==="sub"?R.filter(r=>r.h===h).length:0}})}catch(e){}}
if(mode==="sub"){S.recs=S.recs.filter(r=>r.h!==h);S.shelves=S.shelves.filter(s=>s.h!==h);Object.keys(S.cnt).forEach(k=>{if(k.startsWith(h+"-"))delete S.cnt[k]})}
out.filter(r=>r.c).forEach(r=>{const[,l,n]=r.c.split("-");S.cnt[h+"-"+l]=Math.max(S.cnt[h+"-"+l]||0,+n)});
out.forEach(r=>{if(!r.c){const p=plan(h,r._l);S.cnt[h+"-"+r._l]=p.n;r.c=p.code}const[,l,n]=r.c.split("-");while(!S.shelves.find(s=>s.h===h&&s.l===l&&+n>=s.i&&+n<=s.t))newShelf(h,l)});
S.recs.push(...out.map(({_l,...r})=>r));save();prep();IMPOK=`${fmt(out.length)} pastas importadas em ${h}.`;IMP=null;render();toast("Inventário importado")}
function vImp(){const I=IMP;return`<div class="ph"><h1>Importar inventário</h1><p>Carregue a planilha de uma entidade (.xlsx ou .csv). Colunas reconhecidas: Código, Nome, Matrícula, Data de admissão, Data de demissão e Quantidade de folhas. Opcionais: Conservação, Digitalizada e Entrada no Arquivo. Pastas sem código válido recebem o próximo número da letra.</p></div>${IMPOK?`<div class="ok"><b>${IMPOK}</b></div>`:""}<div class="card"><div class="fg"><div><label for="ih">Entidade do inventário</label><select id="ih">${CASAS.map(h=>`<option ${I&&I.h===h?"selected":""}>${h}</option>`).join("")}</select></div><div><label for="im">Modo</label><select id="im"><option value="add">Acrescentar às pastas existentes</option><option value="sub" ${I&&I.mode==="sub"?"selected":""}>Substituir as pastas da entidade</option></select></div><div><label for="if">Arquivo</label><input id="if" type="file" accept=".xlsx,.xls,.csv"></div></div><div id="imp">${impPrev()}</div></div>`}
function bImp(){$("#if").onchange=async e=>{if(!e.target.files[0])return;await readFile(e.target.files[0]);if(IMP.err)$("#imp").innerHTML=impPrev();else reparse()};$("#ih").onchange=reparse;$("#im").onchange=reparse}
/* exportação */
const XCOLS=["Código","Entidade","Nome","Matrícula","Data de admissão","Data de demissão","Quantidade de folhas","Estante","Prateleira","Conservação","Digitalizada","Entrada no Arquivo","Etiqueta impressa em"],fx=d=>d?fd(d):"";
function expRows(h){return by(h).slice().sort((a,b)=>a.c.localeCompare(b.c)).map(r=>{const L=loc(r);return[r.c,r.h,r.n,r.m,fx(r.a),fx(r.d),r.f??"",L?p2(L.e):"",L?L.p:"",kcap(r.k),r.g?"Sim":"Não",fx(r.e),fx(r.q)]})}
function vExp(){return`<div class="ph"><h1>Exportar inventário</h1><p>Escolha as entidades e o formato. As planilhas exportadas podem ser importadas de volta no módulo Importar.</p></div><div class="card"><h3>Entidades</h3><div class="exg">${CASAS.map(h=>`<label class="exc"><input type="checkbox" class="ex" value="${h}" checked><i class="dt" style="background:${COL[h]}"></i><span><b>${h}</b><small>${fmt(by(h).length)} pastas</small></span></label>`).join("")}</div><div class="fg" style="margin-top:32px"><div><label for="xf">Formato</label><select id="xf"><option value="xlsx">Excel (.xlsx)</option><option value="csv">CSV (.csv)</option></select></div><div><label for="xm">Organização</label><select id="xm"><option value="sep">Um arquivo por entidade</option><option value="one">Um arquivo único</option></select></div></div><p class="note" style="margin-top:20px">Colunas: ${XCOLS.join(", ")}. Em um arquivo único, o Excel gera uma aba por entidade e o CSV traz todas as entidades em uma só tabela.</p><div style="margin-top:20px"><button class="btn" data-act="doexp">Exportar</button></div><p class="note" id="xs" role="status" style="margin-top:14px"></p></div>`}
async function doExp(){const hs=[...document.querySelectorAll("input.ex:checked")].map(i=>i.value),st=$("#xs"),f=$("#xf").value,m=$("#xm").value;
if(!hs.length){st.textContent="Selecione ao menos uma entidade.";return}
if(typeof XLSX==="undefined"){st.textContent="A biblioteca de planilhas não carregou. Recarregue a página.";return}
let dl=null;try{dl=await(window.claude&&claude.use?claude.use("downloads"):null)}catch(e){}const sv=dl?(n,d)=>dl.save({filename:n,data:d}):(n,d)=>new Promise(res=>{const b=new Blob([d],{type:n.endsWith(".csv")?"text/csv;charset=utf-8":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();res()},400)});
const ws=h=>{const w=XLSX.utils.aoa_to_sheet([XCOLS,...expRows(h)]);w["!cols"]=[14,10,38,12,16,16,12,9,10,13,12,16,18].map(x=>({wch:x}));return w},bk=sh=>XLSX.write(sh,{type:"array",bookType:"xlsx"}),files=[];
if(f==="xlsx"){if(m==="one"){const wb=XLSX.utils.book_new();hs.forEach(h=>XLSX.utils.book_append_sheet(wb,ws(h),h));files.push(["inventario_SIPAF.xlsx",bk(wb)])}else hs.forEach(h=>{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws(h),"Inventário");files.push([`inventario_${h}.xlsx`,bk(wb)])})}
else{const csv=l=>"\ufeff"+XLSX.utils.sheet_to_csv(XLSX.utils.aoa_to_sheet(l),{FS:";"});if(m==="one")files.push(["inventario_SIPAF.csv",csv([XCOLS,...hs.flatMap(h=>expRows(h))])]);else hs.forEach(h=>files.push([`inventario_${h}.csv`,csv([XCOLS,...expRows(h)])]))}
let ok=0;for(const[n,d]of files){try{await sv(n,d);ok++}catch(e){st.textContent=e&&e.code==="declined"?(ok?`${ok} arquivo(s) salvo(s). Exportação interrompida.`:"Exportação cancelada."):"Não foi possível salvar "+n+".";return}}
st.textContent=`${ok} arquivo(s) exportado(s).`}
/* etiquetas (SIGEA) */
let ET={h:"SESI",m:"pend",q:""};const ES=new Set();
function etList(){let l=by(ET.h).filter(r=>ET.m==="all"||(ET.m==="pend"?!r.q:!!r.q));const ts=norm(ET.q).split(/[\s,]+/).filter(Boolean);l=ts.length?l.map(r=>[score(r,ts),r]).filter(x=>x[0]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]):l.sort((a,b)=>a.c.localeCompare(b.c));return{tot:l.length,l:l.slice(0,200)}}
const etSel=()=>R.filter(r=>ES.has(r.c)&&r.h===ET.h).sort((a,b)=>a.c.localeCompare(b.c)),etTxt=l=>l.map(r=>r.n+"\t"+(r.m||"")).join("\n");
async function copyTxt(s){try{await navigator.clipboard.writeText(s);return true}catch(e){const a=document.createElement("textarea");a.value=s;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}a.remove();return ok}}
function etSum(){const l=etSel(),s=$("#ets"),x=$("#etx");if(s)s.textContent=l.length+" selecionada(s)";if(x)x.value=etTxt(l)}
function etPrev(){const{tot,l}=etList(),el=$("#etp");if(!el)return;el.innerHTML=`<div class="etbar"><b id="ets"></b><button class="btn sm sec" data-act="etall">Selecionar exibidas</button><button class="btn sm sec" data-act="etnone">Limpar seleção</button><button class="btn sm" data-act="etcopy">Copiar lista</button><button class="btn sm sec" data-act="etmark">Marcar como impressas</button><button class="btn sm sec" data-act="etunmark">Marcar como pendentes</button></div><p class="note">${fmt(tot)} pasta(s) neste filtro${tot>l.length?`. Exibindo as ${l.length} primeiras; use o filtro para refinar`:""}.</p>`+(l.length?`<div class="tw"><table><thead><tr><th></th><th>Código</th><th>Nome</th><th>Matrícula</th><th>Etiqueta</th></tr></thead><tbody>${l.map(r=>`<tr><td><input type="checkbox" class="ec" data-c="${r.c}" aria-label="Selecionar ${esc(r.n)}" ${ES.has(r.c)?"checked":""}></td><td><code>${r.c}</code></td><td>${esc(r.n)}</td><td>${esc(r.m)}</td><td>${r.q?"Impressa em "+fd(r.q):"Pendente"}</td></tr>`).join("")}</tbody></table></div>`:'<div class="emp">Nenhuma pasta neste filtro.</div>')+`<label for="etx" style="margin-top:24px">Lista selecionada no formato do SIGEA</label><textarea id="etx" readonly rows="5"></textarea>`;etSum()}
function vEt(){const o=(v,t)=>`<option value="${v}" ${ET.m===v?"selected":""}>${t}</option>`;return`<div class="ph"><h1>Etiquetas</h1><p>Escolha as pastas cujas etiquetas serão impressas no SIGEA.</p></div><div class="card"><h3>Seleção</h3><div class="fg"><div><label for="eh">Entidade</label><select id="eh">${CASAS.map(h=>`<option ${ET.h===h?"selected":""}>${h}</option>`).join("")}</select></div><div><label for="em">Pastas</label><select id="em">${o("pend","Sem etiqueta impressa")}${o("all","Todas")}${o("done","Com etiqueta impressa")}</select></div><div><label for="eq">Filtrar</label><input id="eq" type="search" placeholder="Nome, matrícula ou código" value="${esc(ET.q)}"></div></div><div id="etp" style="margin-top:28px"></div></div><div class="card"><h3>Como usar com o SIGEA</h3><ol class="note" style="line-height:1.8"><li>Marque as pastas desejadas, uma a uma ou com Selecionar exibidas. A seleção é mantida ao trocar o filtro e vale para uma entidade por vez.</li><li>Clique em Copiar lista. No SIGEA, abra Pasta funcional, clique em Colar lista, cole e confirme.</li><li>Em Logo para todas as etiquetas, selecione a logo da entidade e imprima.</li><li>Volte aqui e clique em Marcar como impressas. O estado também pode ser ajustado na edição de cada pasta.</li></ol></div>`}
function bEt(){$("#eh").onchange=()=>{ET.h=$("#eh").value;ES.clear();etPrev()};$("#em").onchange=()=>{ET.m=$("#em").value;etPrev()};$("#eq").oninput=()=>{ET.q=$("#eq").value;etPrev()};$("#etp").onchange=e=>{const c=e.target.dataset&&e.target.dataset.c;if(!c)return;e.target.checked?ES.add(c):ES.delete(c);etSum()};etPrev()}
/* núcleo */
const V={inicio:[vInicio,bBusca],cadastro:[vCad,bCad],importar:[vImp,bImp],exportar:[vExp],etiquetas:[vEt,bEt],paineis:[vPain],qualidade:[vQual],admin:[vAdm,bAdm]};
const novoBtn=()=>`<span class="dd"><button class="btn" data-act="menu" data-m="n" aria-expanded="${MENU==="n"}">Novo</button><div class="dm dmr" ${MENU==="n"?"":"hidden"}><a href="#cadastro">Cadastro de pasta</a><a href="#importar">Importar inventário</a><a href="#exportar">Exportar inventário</a></div></span>`;
function render(){if(!S)return;const usr=(DB_EMAIL||"").split("@")[0]||"usuário";let h=location.hash.slice(1),r;if(h==="busca")h="inicio";if(h==="paineis")h="acervo";if(TABS.some(x=>x[0]===h)){TAB=h;r="paineis"}else r=h in V?h:"inicio";if(r==="admin"&&DB_ROLE!=="admin")r="inicio";if(DB_ROLE==="consulta"&&(r==="cadastro"||r==="importar"))r="inicio";const on=k=>r===k?"on":"";
$("#hd").innerHTML=`<a class="lo" href="#inicio"><span><b>SIPAF</b><small><span class="lt">Sistema Inteligente de Pastas Funcionais</span></small></span></a><nav class="nv" aria-label="Módulos"><a href="#inicio" class="${on("inicio")}">Início</a><a href="#etiquetas" class="${on("etiquetas")}">Etiquetas</a><span class="dd"><button data-act="menu" data-m="p" aria-expanded="${MENU==="p"}" class="${on("paineis")}">Painéis</button><div class="dm" ${MENU==="p"?"":"hidden"}>${TABS.map(x=>`<a href="#${x[0]}">${x[1]}</a>`).join("")}</div></span><a href="#qualidade" class="${on("qualidade")}">Pendências</a>${DB_ROLE==="admin"?`<a href="#admin" class="${on("admin")}">Administração</a>`:""}</nav>${themeBtn()}<span class="dd"><button class="usr" data-act="menu" data-m="u" aria-expanded="${MENU==="u"}" title="${esc(DB_EMAIL)}">${esc(usr)}</button><div class="dm dmr" ${MENU==="u"?"":"hidden"}><button type="button" data-db="logout">Sair</button></div></span>`;
$("#main").className="";$("#main").innerHTML=(DB_ROLE==="consulta"?"":`<div class="nova">${novoBtn()}</div>`)+V[r][0]();$("#main").dataset.v=r;
$("#fo").innerHTML=`<div class="cols"><div class="fb"><b>SIPAF</b><p>Sistema Inteligente de Pastas Funcionais</p><a class="btn sm fbtn" href="#cadastro">Cadastro de pasta</a></div><div><h4>Módulos</h4><a href="#inicio">Início</a><a href="#cadastro">Cadastro de pasta</a><a href="#importar">Importar inventário</a><a href="#exportar">Exportar inventário</a><a href="#etiquetas">Etiquetas</a><a href="#qualidade">Pendências</a>${DB_ROLE==="admin"?`<a href="#admin">Administração</a>`:""}</div><div><h4>Painéis de gestão</h4>${TABS.map(x=>`<a href="#${x[0]}">${x[1]}</a>`).join("")}</div><div><h4>Entidades</h4>${CASAS.map(h=>`<a href="#inicio" data-ent="${h}"><i class="dt" style="background:${COL[h]};margin-right:8px"></i>${h}</a>`).join("")}</div></div><div class="wm" aria-hidden="true">SIPAF</div><div class="fb2"><small>© 2026 Sistema FIEMA · SIPAF v1.0</small><div class="fact"><button type="button" class="up" data-db="logout" title="${esc(DB_EMAIL)}">Sair</button><button type="button" class="up" data-top>Voltar ao topo ↑</button>${themeBtn()}</div></div>`;
if(V[r][1])V[r][1]();drawer()}
function toast(t){const e=$("#ts");e.innerHTML=`<div class="tst" role="status">${t}</div>`;setTimeout(()=>e.innerHTML="",2600)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(MENU&&!(t&&t.dataset.act==="menu")&&!e.target.closest(".dm")){MENU="";render()}if(!t)return;const a=t.dataset.act;if(a==="menu"){MENU=MENU===t.dataset.m?"":t.dataset.m;render()}else if(a==="casa"){Q.h=t.dataset.h;Q.q="";render();$("#res").scrollIntoView({behavior:"smooth"})}else if(a==="open"){e.preventDefault();D=t.dataset.c;DM="view";drawer()}else if(a==="close"){D=null;DM="view";drawer()}else if(a==="edit"){DM="edit";drawer()}else if(a==="del"){DM="del";drawer()}else if(a==="canc"){DM="view";drawer()}else if(a==="saveedit")saveEdit();else if(a==="confdel"){const c=D;S.recs=S.recs.filter(x=>x.c!==c);D=null;DM="view";save();prep();render();toast("Pasta "+c+" removida")}else if(a==="doimp")doImp();else if(a==="doexp")doExp();else if(a==="etcopy"){const l=etSel();if(!l.length){toast("Selecione ao menos uma pasta.");return}copyTxt(etTxt(l)).then(ok=>toast(ok?l.length+" linha(s) copiadas":"Não foi possível copiar. Selecione o texto e use Ctrl+C."))}else if(a==="etmark"||a==="etunmark"){const l=etSel();if(!l.length){toast("Selecione ao menos uma pasta.");return}l.forEach(r=>r.q=a==="etmark"?iso:null);ES.clear();save();prep();toast(l.length+(a==="etmark"?" pasta(s) marcadas como impressas":" pasta(s) marcadas como pendentes"));etPrev()}else if(a==="etall"){etList().l.forEach(r=>ES.add(r.c));etPrev()}else if(a==="etnone"){ES.clear();etPrev()}else if(a==="tab"){TAB=t.dataset.t;render()}else if(a==="qf"){QF=t.dataset.q;render()}else if(a==="save")saveCad();else if(a==="ask"){CONF=true;render()}else if(a==="cancel"){CONF=false;render()}else if(a==="savepres"){const r=R.find(x=>x.c===D);r.k=$("#dk").value;r.g=+$("#dg").value;save();toast("Preservação atualizada");D=null;render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&D){D=null;DM="view";drawer()}if(e.key==="Enter"&&e.target.matches("tr[data-act]"))e.target.click()});
addEventListener("hashchange",()=>{CAD=null;CONF=false;MENU="";IMPOK="";render();scrollTo(0,0)});
dbBoot();
</script>
